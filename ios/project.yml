# Mô tả dự án iOS cho XcodeGen. Máy macOS của GitHub Actions tạo file .xcodeproj từ đây
# (không cần Xcode trên máy Windows).
name: Ltube
options:
  bundleIdPrefix: com.giadinh
  deploymentTarget:
    iOS: "17.0"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.10"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  Ltube:
    type: application
    platform: iOS
    sources:
      - path: Ltube
    dependencies:
      - package: YouTubeKit
    info:
      path: Ltube/Info.plist
      properties:
        CFBundleDisplayName: Ltube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.giadinh.ltube
            CFBundleURLSchemes: [ltube]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giadinh.ltube
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
